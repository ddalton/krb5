name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        toolchain: ["1.85", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
  live-kdc:
    # The client against a real MIT KDC, and its GSS tokens against MIT's
    # own acceptor. Pinned: it depends on the distro's MIT krb5 and
    # python3-gssapi packages, so a new image is a deliberate upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq krb5-kdc krb5-admin-server krb5-user python3-gssapi
      - run: scripts/test-kdc.sh "$RUNNER_TEMP/krb5test"
      - run: cat "$RUNNER_TEMP/krb5test/test.env" >> "$GITHUB_ENV"
      - run: cargo test --test kdc -- --nocapture
        env:
          # Also compare the DNS resolver with dig on public realms' records.
          KRB5_TEST_DNS: "1"
      - run: cargo build --example gss_client
      - run: KRB5_CONFIG="$KRB5_TEST_DIR/krb5.conf" scripts/mit-acceptor.py "$KRB5_TEST_DIR" target/debug/examples/gss_client
      # KCM caches against sssd-kcm, the Fedora/RHEL default, with MIT's
      # tools on the other side. (Heimdal's kcm is tested by hand: it
      # wants the same socket.)
      - run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends sssd-kcm
          sudo systemctl start sssd-kcm.socket
          test -S /var/run/.heim_org.h5l.kcm-socket
      - run: cargo test --test kdc kcm_ -- --nocapture
        env:
          KRB5_TEST_KCM: "1"
