name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        toolchain: ["1.85", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test
      - run: cargo test --features pkinit
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features pkinit -- -D warnings
  live-kdc:
    # The client against a real MIT KDC, and its GSS tokens against MIT's
    # own acceptor. Pinned: it depends on the distro's MIT krb5 and
    # python3-gssapi packages, so a new image is a deliberate upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq krb5-kdc krb5-admin-server krb5-user krb5-pkinit python3-gssapi
      - run: scripts/test-kdc.sh "$RUNNER_TEMP/krb5test"
      - run: cat "$RUNNER_TEMP/krb5test/test.env" >> "$GITHUB_ENV"
      # PKINIT must be set up here, not skipped.
      - run: test "$KRB5_TEST_PKINIT" = 1
      - run: cargo test --features pkinit --test kdc -- --nocapture
        env:
          # Also compare the DNS resolver with dig on public realms' records.
          KRB5_TEST_DNS: "1"
      # The PKINIT tests again with a P-256 KDC key: MIT's KDC signs with
      # ECDSA (labelled RSA before 1.22).
      - run: |
          kill "$(cat "$KRB5_TEST_DIR/kdc.pid")"
          KRB5_TEST_PKINIT_EC_KDC=1 scripts/test-kdc.sh "$RUNNER_TEMP/krb5ec"
          set -a; . "$RUNNER_TEMP/krb5ec/test.env"; set +a
          cargo test --features pkinit --test kdc pkinit -- --nocapture
          kill "$(cat "$KRB5_TEST_DIR/kdc.pid")"
          scripts/test-kdc.sh "$RUNNER_TEMP/krb5test"
      - run: cargo build --example gss_client
      - run: KRB5_CONFIG="$KRB5_TEST_DIR/krb5.conf" scripts/mit-acceptor.py "$KRB5_TEST_DIR" target/debug/examples/gss_client
      # KCM caches against sssd-kcm, the Fedora/RHEL default, with MIT's
      # tools on the other side. (Heimdal's kcm is tested by hand: it
      # wants the same socket.)
      - run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends sssd-kcm
          sudo systemctl start sssd-kcm.socket
          test -S /var/run/.heim_org.h5l.kcm-socket
      - run: cargo test --test kdc kcm_ -- --nocapture
        env:
          KRB5_TEST_KCM: "1"
  live-kdc-mit122:
    # ECDH PKINIT needs MIT 1.22, newer than Ubuntu's package: built from
    # the release tarball (checksum-pinned), cached between runs.
    runs-on: ubuntu-24.04
    env:
      MIT: /home/runner/mit-krb5-1.22.2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: mit
        with:
          path: /home/runner/mit-krb5-1.22.2
          key: mit-krb5-1.22.2-ubuntu-24.04
      - if: steps.mit.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bison libssl-dev
          cd "$RUNNER_TEMP"
          curl -sSfO https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
          echo "3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13  krb5-1.22.2.tar.gz" | sha256sum -c
          tar -xzf krb5-1.22.2.tar.gz
          cd krb5-1.22.2/src
          ./configure --prefix="$MIT" --disable-nls >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
      - run: |
          echo "$MIT/bin" >> "$GITHUB_PATH"
          echo "$MIT/sbin" >> "$GITHUB_PATH"
      - run: klist -V
      - run: scripts/test-kdc.sh "$RUNNER_TEMP/krb5test"
      - run: cat "$RUNNER_TEMP/krb5test/test.env" >> "$GITHUB_ENV"
      - run: test "$KRB5_TEST_PKINIT_ECDH" = 1
      - run: cargo test --features pkinit --test kdc -- --nocapture
      - run: |
          kill "$(cat "$KRB5_TEST_DIR/kdc.pid")"
          KRB5_TEST_PKINIT_EC_KDC=1 scripts/test-kdc.sh "$RUNNER_TEMP/krb5ec"
          set -a; . "$RUNNER_TEMP/krb5ec/test.env"; set +a
          cargo test --features pkinit --test kdc pkinit -- --nocapture
