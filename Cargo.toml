[package]
name = "krb5"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust Kerberos 5: GSS-API acceptor and initiator, KDC client (AS/TGS), keytabs, FILE/DIR/KCM credential caches, krb5.conf, RFC 3961/3962/8009 crypto and RFC 4121 Wrap/MIC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ddalton/krb5"
documentation = "https://docs.rs/krb5"
readme = "README.md"
keywords = ["kerberos", "krb5", "gssapi", "rpcsec_gss", "nfs"]
categories = ["authentication", "cryptography", "network-programming"]
exclude = ["/.github"]

[dependencies]
aes = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
