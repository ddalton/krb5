[package]
name = "krb5"
version = "0.8.1"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust Kerberos 5: GSS-API acceptor and initiator, KDC client (AS/TGS, cross-realm referrals), keytabs, FILE/DIR/KCM credential caches, krb5.conf, RFC 3961/3962/8009 crypto and RFC 4121 Wrap/MIC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ddalton/krb5"
documentation = "https://docs.rs/krb5"
readme = "README.md"
keywords = ["kerberos", "krb5", "gssapi", "rpcsec_gss", "nfs"]
categories = ["authentication", "cryptography", "network-programming"]
exclude = ["/.github"]

[dependencies]
aes = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
thiserror = "1.0"
tracing = "0.1"
crypto-bigint = { version = "0.7.5", optional = true, default-features = false, features = ["alloc"] }
p256 = { version = "0.14", optional = true, default-features = false, features = ["ecdh", "ecdsa"] }
p384 = { version = "0.14", optional = true, default-features = false, features = ["ecdh", "ecdsa"] }
p521 = { version = "0.14", optional = true, default-features = false, features = ["ecdh", "ecdsa"] }
des = { version = "0.8", optional = true }
rc2 = { version = "0.8", optional = true }

[features]
# PKINIT (RFC 4556), anonymous PKINIT (RFC 8062) and ECDH/ECDSA (RFC 5349):
# `krb5::pkinit`.
pkinit = ["dep:crypto-bigint", "dep:p256", "dep:p384", "dep:p521", "dep:des", "dep:rc2"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
serde_json = "1.0"
