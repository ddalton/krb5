[package]
name = "krb5-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
krb5 = { path = "..", features = ["pkinit"] }

# Not part of the crate's workspace.
[workspace]

[profile.release]
debug = 1


[[bin]]
name = "acceptor_token"
path = "fuzz_targets/acceptor_token.rs"
test = false
doc = false
bench = false

